# Render Blueprint - lets you deploy this backend with "New +  Blueprint" pointing at this
# repo, instead of clicking through manual service setup. See DEPLOYMENT.md for the full
# walkthrough including the values you still need to fill in (DATABASE_URL from Supabase, etc.)
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: skillforge-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (not committed here - see DEPLOYMENT.md):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      # Optional - see .env.example for the full list (SMTP_*, JUDGE_CONCURRENCY, etc.)
