# Render Blueprint - deploys the API only. The Vite frontend is built and hosted separately
# on Vercel. See DEPLOYMENT.md for the full walkthrough.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: skillforge-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (not committed here - see DEPLOYMENT.md):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      # Optional - see .env.example for the full list (SMTP_*, JUDGE_CONCURRENCY, etc.)
