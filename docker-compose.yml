version: '3.9'

# SkillForge Code — Production Docker Compose
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f api    # tail API logs
#   docker compose down           # stop all
#
# Prerequisites:
#   - Copy .env.example to .env and fill in DATABASE_URL, JWT_SECRET, etc.
#   - Build the judge image first: ./scripts/build-judge-image.sh
#   - The judge worker needs access to the Docker socket to spawn containers.
#     This is intentional and scoped: only the worker service mounts it,
#     never the API or any student-facing container.

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    # Redis is NOT exposed to the host. Only api and worker can reach it
    # via the internal Docker network.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    ports:
      - "8787:8787"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Judge Worker ───────────────────────────────────────────────────────────
  # Separate process that pulls jobs from Redis/BullMQ and runs Docker containers.
  # Mounting /var/run/docker.sock here is intentional — the worker needs it to
  # spawn judge containers. It is NOT mounted into student code containers.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "server/worker.ts"]
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JUDGE_RUNTIME=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp:/tmp
    depends_on:
      redis:
        condition: service_healthy

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  redis_data:
